<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hewitt Plumbing & Heating | Links</title>
    <meta name="description" content="Connect with Hewitt Plumbing & Heating in St Albans. Get an instant estimate, call us, or follow our social media.">
    <link rel="canonical" href="https://www.hewittplumbing.co.uk/social.html" />
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Dancing+Script:wght@500;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-black: #000000;
            --bg-dark: #111111;
            --bg-card: #1a1a1a;
            --brand-red: #e60000;
            --brand-red-light: #ff1a1a;
            --text-light: #ffffff;
            --text-grey: #cccccc;
            --text-muted: #888888;
            --border-dark: #333333;
            --transition-medium: all 0.3s ease;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--bg-black);
            color: var(--text-light);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem 1.5rem;
            background-image: radial-gradient(circle at top, rgba(230, 0, 0, 0.1) 0%, transparent 40%),
                              radial-gradient(circle at bottom, rgba(230, 0, 0, 0.05) 0%, transparent 50%);
            background-attachment: fixed;
        }

        /* LOGO */
        .logo-container {
            margin-bottom: 2rem;
            text-align: center;
            animation: slideDown 0.6s ease forwards;
            opacity: 0;
            transform: translateY(-20px);
        }
        .logo { display: flex; flex-direction: column; align-items: center; gap: 0.2rem; text-decoration: none; }
        .logo-mark { width: 60px; height: 60px; display: flex; align-items: center; justify-content: center; font-size: 3rem; color: var(--brand-red); text-shadow: 0 0 15px rgba(230,0,0,0.6); margin-bottom: -15px; z-index: 10; }
        .logo-text { display: flex; flex-direction: column; align-items: center; }
        .logo-text .brand { font-family: 'Oswald', sans-serif; font-size: 2.8rem; font-weight: 700; color: #ffffff; letter-spacing: 0.05em; line-height: 1; text-transform: uppercase; background: linear-gradient(to bottom, #ffffff 40%, #888888 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; filter: drop-shadow(2px 3px 0 rgba(230,0,0,0.8)); margin-bottom: 4px; }
        .logo-text .tagline { font-family: 'Oswald', sans-serif; font-size: 0.85rem; color: #ffffff; text-transform: uppercase; letter-spacing: 0.2em; font-weight: 600; background: var(--brand-red); padding: 4px 12px; border-radius: 2px; }

        .script-accent { 
            font-family: 'Dancing Script', cursive; 
            font-size: 1.8rem; 
            color: var(--text-light); 
            display: block; 
            margin-top: 1.5rem;
            transform: rotate(-3deg); 
            text-shadow: 1px 1px 4px rgba(0,0,0,0.8);
        }

        /* LINKS */
        .links-container {
            width: 100%;
            max-width: 450px;
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
            margin-top: 2rem;
        }

        .link-card {
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-card);
            color: var(--text-light);
            text-decoration: none;
            padding: 1.2rem 1.5rem;
            border: 2px solid var(--border-dark);
            border-radius: 4px;
            font-family: 'Oswald', sans-serif;
            font-size: 1.2rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            font-weight: 600;
            position: relative;
            overflow: hidden;
            transition: var(--transition-medium);
            opacity: 0;
            animation: fadeIn 0.5s ease forwards;
        }

        .link-card:nth-child(1) { animation-delay: 0.2s; }
        .link-card:nth-child(2) { animation-delay: 0.3s; }
        .link-card:nth-child(3) { animation-delay: 0.4s; }
        .link-card:nth-child(4) { animation-delay: 0.5s; }
        .link-card:nth-child(5) { animation-delay: 0.6s; }

        .link-card::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(230,0,0,0.2), transparent);
            transition: left 0.5s ease;
        }

        .link-card:hover {
            border-color: var(--brand-red);
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(230, 0, 0, 0.15);
            background: var(--bg-dark);
        }

        .link-card:hover::before { left: 100%; }

        .link-card.primary {
            background: var(--brand-red);
            border-color: var(--brand-red);
            color: var(--bg-black);
            text-shadow: none;
        }
        
        .link-card.primary:hover {
            background: var(--brand-red-light);
            border-color: var(--brand-red-light);
            color: var(--bg-black);
        }

        .footer {
            margin-top: auto;
            padding-top: 3rem;
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.15em;
        }

        @keyframes slideDown {
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeIn {
            to { opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="logo-container">
        <a href="index.html" class="logo">
            <div class="logo-mark">
                <svg xmlns="http://www.w3.org/2000/svg" width="50" height="50" viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"></path></svg>
            </div>
            <div class="logo-text">
                <span class="brand">Hewitt</span>
                <span class="tagline">Plumbing & Heating</span>
            </div>
        </a>
        <span class="script-accent">Your Local Experts</span>
    </div>

    <div class="links-container">
        <a href="estimate.html" class="link-card primary">Get an Instant Estimate</a>
        <a href="index.html" class="link-card">Visit Main Website</a>
        <a href="tel:07540182837" class="link-card">Call Us Now</a>
        <a href="https://facebook.com/hewittplumbing" class="link-card" target="_blank" rel="noopener">Facebook</a>
        <a href="https://instagram.com/hewittplumbing" class="link-card" target="_blank" rel="noopener">Instagram</a>
    </div>

    <div class="footer">
        &copy; 2026 Hewitt Plumbing & Heating
    </div>

</body>
</html>
